[package]
name = "sentryiq-tuf-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
sha2 = "=0.10.9"
subtle = "=2.6.1"
tuffet = "=0.1.0"
uniffi = { version = "=0.32.2", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
