; SentryIQ Gallery upload limits
; Allows normal phone/camera photos to reach the application for validation
; and processing instead of being discarded by PHP before gallery_upload.php runs.
post_max_size = 32M
upload_max_filesize = 24M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; PHP runtime hardening
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
; expose_php and allow_url_include are system-level settings and must be set by the host PHP configuration.

; Keep PHP's session defaults aligned with the application security bootstrap.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.cookie_path = /
