name: PHP JCS Candidate Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/fixtures/jcs-rfc8785-vectors.json'
      - 'tests/jcs-candidate/**'
      - '.github/workflows/php-jcs-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/fixtures/jcs-rfc8785-vectors.json'
      - 'tests/jcs-candidate/**'
      - '.github/workflows/php-jcs-candidate.yml'

permissions:
  contents: read

jobs:
  candidate-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
      - name: Resolve pinned candidate package
        run: composer update --working-dir=tests/jcs-candidate --no-interaction --prefer-dist --no-scripts
      - name: Run RFC 8785 vectors and strict-input tests
        run: |
          php tests/jcs-candidate/qualify.php
          php tests/jcs-candidate/qualify-php-ron.php
