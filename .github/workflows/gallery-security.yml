name: Gallery Security Checks

on:
  push:
    branches: [main, feature/zero-knowledge-gallery-storage, feature/gallery-zero-knowledge-e2e]
  pull_request:
    branches: [main]

jobs:
  gallery-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser Gallery scripts
        run: |
          node --check assets/js/gallery_crypto.js
          node --check assets/js/gallery_secure.js
          node --check assets/js/gallery_storage.js
          node --check assets/js/gallery_secure_ui.js
          node --check assets/js/gallery_session_guard.js
          node --check tests/gallery_crypto.test.js
          node --check tests/gallery_session_guard.test.js
          node --check tests/gallery_csp.test.js
          node --check tests/gallery_memory.test.js
          node --check tests/gallery_upload_boundary.test.js
          node --check tests/gallery_device_management.test.js
          node --check tests/gallery_recovery_flow.test.js

      - name: Test browser-side Gallery cryptography
        run: node --test tests/gallery_crypto.test.js tests/gallery_session_guard.test.js tests/gallery_csp.test.js tests/gallery_memory.test.js tests/gallery_upload_boundary.test.js tests/gallery_device_management.test.js tests/gallery_recovery_flow.test.js

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Test Gallery storage and authorization primitives
        run: php tests/gallery_storage.test.php

      - name: Test Gallery keyring transition model
        run: php tests/gallery_keyring.test.php

      - name: Test persistent Gallery keyring storage
        run: php tests/gallery_key_store_v2.test.php

      - name: Test shared Gallery rotation lock
        run: php tests/gallery_rotation_lock.test.php

      - name: Test release trust policy decisions
        run: php tests/release_trust_policy.test.php

      - name: Test GitHub CLI attestation adapter contract
        run: php tests/github_cli_attestation_verifier.test.php
