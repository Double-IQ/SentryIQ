name: Integrity Node Tests

on:
  pull_request:
    branches: [main, feat/signed-integrity-event-evidence, feat/btm-sa-node4-report-ingestion-rebased, feat/native-sigstore-node-artifact-verification-rebased]
    paths:
      - 'app/Updates/IntegrityNode*.php'
      - 'app/Updates/IntegrityReport*.php'
      - 'app/Updates/IntegrityEventReportVerifier.php'
      - 'app/Updates/FileIntegrityEventStore.php'
      - 'app/Updates/IntegrityIncidentCorrelator.php'
      - 'app/Updates/IntegrityAlertDispatcher.php'
      - 'app/Updates/IntegrityEventClient.php'
      - 'app/Updates/IntegrityNodeEventRunner.php'
      - 'app/Updates/IntegrityReleaseArtifactFetcher.php'
      - 'app/Updates/IntegrityPublicAssetPolicy.php'
      - 'bin/integrity-node-run.php'
      - 'bin/integrity-node-keygen.php'
      - 'app/Updates/IntegrityDeployedReleaseResolver.php'
      - 'app/Updates/IntegrityNodeReleaseStateStore.php'
      - 'app/Updates/IntegrityNodeKeyGenerator.php'
      - 'app/Updates/IntegrityNodeEvidenceStore.php'
      - 'tests/integrity_deployed_release_resolver.test.php'
      - 'tests/integrity_node_release_state.test.php'
      - 'tests/integrity_node_key_generator.test.php'
      - 'tests/integrity_node_evidence_store.test.php'
      - 'app/Updates/NativeSigstoreIntegrityAttestationVerifier.php'
      - 'app/Updates/NativeSigstoreReleaseVerifier.php'
      - 'app/Updates/ReleaseArtifactVerifier.php'
      - 'app/Updates/ReleaseTrustPolicy.php'
      - 'app/Updates/SigstoreProvenance.php'
      - 'app/Updates/TufRootStore.php'
      - 'tests/native_sigstore_integrity_adapter.test.php'
      - 'tests/release_trust_policy.test.php'
      - 'tests/sigstore_provenance.test.php'
      - 'docs/security/integrity-node-native-sigstore-runtime.md'
      - 'tests/integrity_release_artifact_fetcher.test.php'
      - 'app/Updates/IntegrityNode4Monitor.php'
      - 'app/Updates/IntegrityNode4RuntimeConfig.php'
      - 'bin/integrity-node4-monitor.php'
      - 'integrity_event.php'
      - 'tests/integrity_node4_runtime_config.test.php'
      - 'tests/integrity_*.test.php'
      - 'tests/native_sigstore_integrity_adapter.test.php'
      - 'tests/release_trust_policy.test.php'
      - 'tests/sigstore_provenance.test.php'
      - 'tests/file_integrity_event_store.test.php'
      - 'tests/integrity_incident_correlator.test.php'
      - 'tests/integrity_alert_dispatcher.test.php'
      - 'tests/integrity_event_client.test.php'
      - 'tests/integrity_node_event_runner.test.php'
      - 'tests/integrity_node4_monitor.test.php'
      - '.github/workflows/integrity-node-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app/Updates/IntegrityNode*.php'
      - 'app/Updates/IntegrityReport*.php'
      - 'tests/integrity_*.test.php'
      - '.github/workflows/integrity-node-tests.yml'

permissions:
  contents: read

jobs:
  integrity-node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium

      - name: Run Integrity Node regression tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/integrity_report_signer.test.php
          php tests/integrity_report_verifier.test.php
          php tests/integrity_event_report_verifier.test.php
          php tests/file_integrity_event_store.test.php
          php tests/integrity_incident_correlator.test.php
          php tests/integrity_alert_dispatcher.test.php
          php tests/integrity_event_client.test.php
          php tests/integrity_node_event_runner.test.php
          php tests/integrity_node_scheduled_runner.test.php
          php -l app/Updates/IntegrityDeployedReleaseResolver.php
          php -l app/Updates/IntegrityNodeReleaseStateStore.php
          php tests/integrity_deployed_release_resolver.test.php
          php tests/integrity_node_release_state.test.php
          php tests/integrity_node_key_generator.test.php
          php tests/integrity_node_evidence_store.test.php
          php tests/integrity_release_artifact_fetcher.test.php
          php tests/integrity_node4_monitor.test.php
          php tests/integrity_node4_runtime_config.test.php
          php tests/integrity_node_a.test.php
          php tests/integrity_node_b.test.php
          php tests/integrity_node_c.test.php
          php tests/integrity_public_asset_policy.test.php
          php -l bin/integrity-node-run.php
          php -l bin/integrity-node-keygen.php
          php -l app/Updates/TufRootStore.php
          php -l app/Updates/ReleaseArtifactVerifier.php
          php -l app/Updates/SigstoreProvenance.php
          php -l app/Updates/ReleaseTrustPolicy.php
          php -l app/Updates/NativeSigstoreReleaseVerifier.php
          php -l app/Updates/NativeSigstoreIntegrityAttestationVerifier.php
          php tests/release_trust_policy.test.php
          php tests/sigstore_provenance.test.php
          php tests/native_sigstore_integrity_adapter.test.php
