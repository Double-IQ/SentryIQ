name: Native TUF Core

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tuf-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust formatting
        run: rustfmt --check native/tuf-core/src/lib.rs
      - name: Test shared TUF core
        run: cargo test --manifest-path native/tuf-core/Cargo.toml
