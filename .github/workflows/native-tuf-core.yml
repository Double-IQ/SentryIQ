name: Native TUF Core

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tuf-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Check Rust formatting
        run: rustfmt --check src/lib.rs src/bin/uniffi-bindgen.rs
        working-directory: native/tuf-core
      - name: Test shared TUF core
        run: cargo test
        working-directory: native/tuf-core
      - name: Build shared TUF library
        run: cargo build
        working-directory: native/tuf-core
      - name: Generate Kotlin UniFFI bindings
        run: cargo run --bin uniffi-bindgen -- generate --library target/debug/libsentryiq_tuf_core.so --language kotlin --out-dir target/bindings/kotlin
        working-directory: native/tuf-core
      - name: Generate Swift UniFFI bindings
        run: cargo run --bin uniffi-bindgen -- generate --library target/debug/libsentryiq_tuf_core.so --language swift --out-dir target/bindings/swift
        working-directory: native/tuf-core
      - name: Assert both binding outputs exist
        run: |
          test -n "$(find target/bindings/kotlin -type f -name '*.kt' -print -quit)"
          test -n "$(find target/bindings/swift -type f -name '*.swift' -print -quit)"
        working-directory: native/tuf-core


      - name: Stage generated bindings in native companions
        run: |
          mkdir -p ../android/SentryIQMaster/master/src/main/java/co/bichet/sentryiq/tuf
          mkdir -p ../ios/SentryIQMaster/Sources/SentryIQTufCoreBindings
          mkdir -p ../ios/SentryIQMaster/Sources/SentryIQTufCoreFFI/include
          cp target/bindings/kotlin/co/bichet/sentryiq/tuf/sentryiq_tuf_core.kt ../android/SentryIQMaster/master/src/main/java/co/bichet/sentryiq/tuf/
          cp target/bindings/swift/SentryIQTufCore.swift ../ios/SentryIQMaster/Sources/SentryIQTufCoreBindings/
          cp target/bindings/swift/SentryIQTufCoreFFI.h ../ios/SentryIQMaster/Sources/SentryIQTufCoreFFI/include/
          cp target/bindings/swift/SentryIQTufCoreFFI.modulemap ../ios/SentryIQMaster/Sources/SentryIQTufCoreFFI/include/module.modulemap
        working-directory: native/tuf-core
      - name: Commit generated bindings to same-repository pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add native/android/SentryIQMaster/master/src/main/java/co/bichet/sentryiq/tuf/sentryiq_tuf_core.kt
          git add native/ios/SentryIQMaster/Sources/SentryIQTufCoreBindings/SentryIQTufCore.swift
          git add native/ios/SentryIQMaster/Sources/SentryIQTufCoreFFI/include/SentryIQTufCoreFFI.h
          git add native/ios/SentryIQMaster/Sources/SentryIQTufCoreFFI/include/module.modulemap
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: generate shared TUF native bindings"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Upload generated native bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentryiq-tuf-native-bindings
          path: native/tuf-core/target/bindings/
          if-no-files-found: error
          retention-days: 3
