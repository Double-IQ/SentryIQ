name: Build Node A Release Candidate (No Publish)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable commit or branch to build"
        required: true
        type: string
        default: "docs/node-a-cloudflare-inventory-and-attestation-review"
      expected_version:
        description: "Must match VERSION in the selected source commit"
        required: true
        type: string
        default: "0.1.3"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve and validate source
        id: source
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          VERSION="$(tr -d '\r\n' < source/VERSION)"
          test "$VERSION" = "$EXPECTED_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Candidate version: %s\nSource commit: %s\n' "$VERSION" "$SOURCE_SHA"

      - name: Build candidate package and canonical inventory
        shell: bash
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          bash scripts/build-release-package.sh \
            "$VERSION" "$SOURCE_SHA" "Double-IQ/SentryIQ" "1345956206" \
            ".github/workflows/node-a-candidate.yml" "$SOURCE_SHA" "release-output"

      - name: Test canonical release manifest builder
        working-directory: source
        run: python3 tests/build_release_manifest.test.py

      - name: Validate complete candidate package
        working-directory: source
        run: python3 tests/release_package.test.py --dist release-output --version "$(tr -d '\r\n' < VERSION)"

      - name: Independently check candidate checksums
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          (cd release-output && sha256sum --check sentryiq-*.zip.sha256 release-manifest.json.sha256)
          printf 'Source commit: %s\n' "${{ steps.source.outputs.source_sha }}" > release-output/CANDIDATE-SOURCE.txt

      - name: Upload review-only candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-a-release-candidate-${{ inputs.expected_version }}-${{ steps.source.outputs.source_sha }}
          path: source/release-output/
          if-no-files-found: error
          retention-days: 7
