name: Build Node A Release Candidate (No Publish)

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Must match VERSION in the selected source commit"
        required: true
        type: string
        default: "0.1.3"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate candidate version and source
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$VERSION" = "$EXPECTED_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'Candidate version: %s\nSource commit: %s\n' "$VERSION" "$GITHUB_SHA"

      - name: Build candidate package and canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          bash scripts/build-release-package.sh \
            "$VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "1345956206" \
            ".github/workflows/node-a-candidate.yml" "$GITHUB_SHA" "release-output"

      - name: Test canonical release manifest builder
        run: python3 tests/build_release_manifest.test.py

      - name: Validate complete candidate package
        run: python3 tests/release_package.test.py --dist release-output --version "$(tr -d '\r\n' < VERSION)"

      - name: Record candidate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release-output && sha256sum --check sentriq-*.zip.sha256 release-manifest.json.sha256)
          printf 'Source commit: %s\n' "$GITHUB_SHA" > release-output/CANDIDATE-SOURCE.txt
          printf 'Workflow: %s\n' "$GITHUB_WORKFLOW"
          printf 'Ref: %s\n' "$GITHUB_REF"

      - name: Upload review-only candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-a-release-candidate-${{ inputs.expected_version }}-${{ github.sha }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7
