name: PHP Syntax Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Test post-install diagnostic access controls
        run: php tests/post_install_diagnostic_access.test.php

      - name: Test durable owner bootstrap challenge consumption
        run: php tests/bootstrap_challenge_store.test.php

      - name: Test canonical trust bundle validation
        run: php tests/trust_bundle_validator.test.php

      - name: Test restricted trust-bundle canonical profile
        run: php tests/trust_bundle_canonical_profile.test.php

      - name: Test server-side owner approval proof verification
        run: php tests/owner_approval_proof_verifier.test.php

      - name: Test signed registry-anchor verification
        run: php tests/registry_anchor_verifier.test.php

      - name: Test authenticated owner bootstrap API integration
        run: php tests/owner_bootstrap_api.test.php
