name: PHP Syntax Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Test post-install diagnostic access controls
        run: php tests/post_install_diagnostic_access.test.php

      - name: Test durable owner bootstrap challenge consumption
        run: php tests/bootstrap_challenge_store.test.php

      - name: Test server-side owner approval proof verification
        run: php tests/owner_approval_proof_verifier.test.php

  ios-master-core:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Build shared Rust TUF XCFramework
        run: bash native/tuf-core/scripts/build-ios-xcframework.sh

      - name: Build iOS master companion core
        run: swift build --package-path native/ios/SentryIQMaster

      - name: Run deterministic cryptographic encoding tests
        run: swift test --package-path native/ios/SentryIQMaster
