name: Node A Workers Runtime PoC

on:
  pull_request:
    paths:
      - "cloudflare/node-a-poc/**"
      - ".github/workflows/node-a-workers-poc.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare/node-a-poc/**"
      - ".github/workflows/node-a-workers-poc.yml"

permissions:
  contents: read

concurrency:
  group: node-a-workers-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workerd-runtime:
    name: Workers runtime and Durable Object tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/node-a-poc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Install pinned direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Run workerd integration tests
        run: npm test
