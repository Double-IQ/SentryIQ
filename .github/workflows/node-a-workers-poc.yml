name: Node A Workers Runtime PoC

on:
  pull_request:
    paths:
      - "cloudflare/node-a-poc/**"
      - "patches/tuf-js-6.0.3-trusted-state-atomicity.patch"
      - ".github/workflows/node-a-workers-poc.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare/node-a-poc/**"
      - "patches/tuf-js-6.0.3-trusted-state-atomicity.patch"
      - ".github/workflows/node-a-workers-poc.yml"

permissions:
  contents: read
  attestations: read

concurrency:
  group: node-a-workers-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workerd-runtime:
    name: Workers runtime and Durable Object tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: cloudflare/node-a-poc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Generate exact dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify pinned dependency lockfile digest
        run: sha256sum --check package-lock.sha256
      - name: Install from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply pinned Sigstore crypto compatibility patch
        run: npm run apply-sigstore-core-compat
      - name: Download genuine v0.1.2 release asset
        run: |
          gh release download v0.1.2 --repo Double-IQ/SentryIQ --pattern sentryiq-0.1.2.zip --dir "$RUNNER_TEMP"
          printf '%s  %s\n' '41cc5fc46055836ebb21ed4501bd6bd3ace249c4f352da0373b85e5a57d9c49e' "$RUNNER_TEMP/sentryiq-0.1.2.zip" | sha256sum --check -
      - name: Download genuine GitHub attestation bundle
        run: |
          cd "$RUNNER_TEMP"
          gh attestation download "$RUNNER_TEMP/sentryiq-0.1.2.zip" --repo Double-IQ/SentryIQ --predicate-type https://slsa.dev/provenance/v1
          mv "$RUNNER_TEMP/sha256:41cc5fc46055836ebb21ed4501bd6bd3ace249c4f352da0373b85e5a57d9c49e.jsonl" "$RUNNER_TEMP/sha256-41cc5fc46055836ebb21ed4501bd6bd3ace249c4f352da0373b85e5a57d9c49e.jsonl"
          gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Inject genuine bundle and current trusted root into workerd test modules
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const bundlePath = process.env.RUNNER_TEMP + "/sha256-41cc5fc46055836ebb21ed4501bd6bd3ace249c4f352da0373b85e5a57d9c49e.jsonl";
          const rootPath = process.env.RUNNER_TEMP + "/trusted_root.jsonl";
          const bundle = fs.readFileSync(bundlePath, "utf8").trim().split(String.fromCharCode(10))[0];
          const trustedRoot = fs.readFileSync(rootPath, "utf8").trim().split(String.fromCharCode(10))[0];
          JSON.parse(bundle);
          JSON.parse(trustedRoot);
          const bundleSource = "export const genuineV012BundleJson: string | null = " + JSON.stringify(bundle) + ";" + String.fromCharCode(10);
          const rootSource = "export const genuineV012TrustedRootJson: string | null = " + JSON.stringify(trustedRoot) + ";" + String.fromCharCode(10);
          fs.writeFileSync("test/fixtures/genuine-v012-bundle.ts", bundleSource);
          fs.writeFileSync("test/fixtures/genuine-v012-trusted-root.ts", rootSource);
          NODE
      - name: Run workerd integration tests
        run: npm test
      - name: Build Worker and inspect bundle for filesystem TUF fallback
        run: |
          OUTDIR="$RUNNER_TEMP/node-a-worker-bundle"
          npx wrangler deploy --dry-run --outdir "$OUTDIR"
          node scripts/check-worker-bundle.mjs "$OUTDIR"
      - name: Export genuine v0.1.2 bundle for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-a-v012-genuine-attestation-bundle
          path: ${{ runner.temp }}/sha256-41cc5fc46055836ebb21ed4501bd6bd3ace249c4f352da0373b85e5a57d9c49e.jsonl
          if-no-files-found: error
          retention-days: 3
      - name: Export current Sigstore trusted root for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-a-current-sigstore-trusted-root
          path: ${{ runner.temp }}/trusted_root.jsonl
          if-no-files-found: error
          retention-days: 3
      - name: Export generated lockfile for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-a-poc-package-lock
          path: cloudflare/node-a-poc/package-lock.json
          if-no-files-found: error
          retention-days: 3

  tuf-upstream-atomicity:
    name: Pinned tuf-js trusted-state atomicity patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SentryIQ
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout pinned upstream tuf-js
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theupdateframework/tuf-js
          ref: ce8ba9cd3f074531976ff4eef82af1f3adae3728
          path: upstream-tuf-js
      - name: Apply SentryIQ trusted-state atomicity patch
        working-directory: ${{ github.workspace }}
        run: |
          PATCH="$GITHUB_WORKSPACE/patches/tuf-js-6.0.3-trusted-state-atomicity.patch"
          test "$(git -C upstream-tuf-js rev-parse HEAD)" = "ce8ba9cd3f074531976ff4eef82af1f3adae3728"
          test "$(git -C upstream-tuf-js rev-parse HEAD:packages/client/src/store.ts)" = "570df07c5b40013a260b00f0b55e692bbfd662f9"
          test "$(git -C upstream-tuf-js rev-parse HEAD:packages/client/tests/updater.test.ts)" = "700821f9c93223d4822384f7e690aa37d954ccb8"
          test "$(git -C upstream-tuf-js rev-parse HEAD:packages/client/src/updater.ts)" = "913ffb7f91bc6a37e4a00a8595b992df1929b09c"
          test "$(git -C upstream-tuf-js rev-parse HEAD:packages/models/src/index.ts)" = "f9768beaea20000a9d7e35a80a34674192e15bd4"
          git -C upstream-tuf-js apply --unidiff-zero --check "$PATCH"
          git -C upstream-tuf-js apply --unidiff-zero "$PATCH"
          git -C upstream-tuf-js diff --check
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Install pinned upstream workspace dependencies
        working-directory: ${{ github.workspace }}/upstream-tuf-js
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build pinned upstream workspaces
        working-directory: ${{ github.workspace }}/upstream-tuf-js
        run: npm run build
      - name: Run upstream TUF client test project
        working-directory: ${{ github.workspace }}/upstream-tuf-js
        run: npm test -- --selectProjects CLIENT --runInBand
