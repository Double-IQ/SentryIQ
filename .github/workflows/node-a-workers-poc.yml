name: Node A Workers Runtime PoC

on:
  pull_request:
    paths:
      - "cloudflare/node-a-poc/**"
      - ".github/workflows/node-a-workers-poc.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare/node-a-poc/**"
      - ".github/workflows/node-a-workers-poc.yml"

permissions:
  contents: read

concurrency:
  group: node-a-workers-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workerd-runtime:
    name: Workers runtime and Durable Object tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/node-a-poc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Generate exact dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run workerd integration tests
        run: npm test
      - name: Export generated lockfile for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-a-poc-package-lock
          path: cloudflare/node-a-poc/package-lock.json
          if-no-files-found: error
          retention-days: 3
