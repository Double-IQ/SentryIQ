name: TUF Root Persistence Boundary

on:
  pull_request:
    paths:
      - 'app/Updates/TufRootStore.php'
      - 'tests/tuf_root_store.test.php'
      - 'tests/tuf_updater_persistence.integration.php'
      - 'tests/tuf_root_store_process.php'
      - 'tools/heliohost-tuf-persistence-probe/**'
      - '.github/workflows/tuf-root-store.yml'
  push:
    branches: [test/tuf-root-persistence-boundary]
    paths:
      - 'app/Updates/TufRootStore.php'
      - 'tests/tuf_root_store.test.php'
      - 'tools/heliohost-tuf-persistence-probe/**'
      - '.github/workflows/tuf-root-store.yml'

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint root store and test
        run: |
          php -l app/Updates/TufRootStore.php
          php -l tests/tuf_root_store.test.php
          php -l tests/tuf_updater_persistence.integration.php
      - name: Run persistence boundary tests
        run: php tests/tuf_root_store.test.php

      - name: Check out pinned TUF source and apply the fail-closed patch
        uses: actions/checkout@v4
        with:
          repository: k2gl/tuf
          ref: 0c324cd765e04c9d47d01fe0e9887d6ab8153bfd
          path: upstream-tuf

      - name: Apply SentryIQ TUF patch and install test autoload
        working-directory: upstream-tuf
        run: |
          git apply --check ../patches/k2gl-tuf-1.2.1-root-404.patch
          git apply ../patches/k2gl-tuf-1.2.1-root-404.patch
          if [ "${{ matrix.php }}" = "8.1" ]; then
            php -r '$c=json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); unset($c["require-dev"]["roave/security-advisories"]); file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);'
          fi
          composer install --prefer-dist --no-progress

      - name: Exercise real TUF updater with durable root storage
        run: php tests/tuf_updater_persistence.integration.php

      - name: Verify root reload in a separate PHP process
        run: |
          private_dir="$(mktemp -d)"
          chmod 700 "$private_dir"
          trap 'rm -rf "$private_dir"' EXIT
          php tests/tuf_root_store_process.php write "$private_dir"
          php tests/tuf_root_store_process.php read "$private_dir"

      - name: Build HelioHost two-request persistence probe bundle
        if: matrix.php == '8.5'
        run: |
          set -euo pipefail
          rm -rf probe-bundle
          mkdir -p probe-bundle/httpdocs probe-bundle/private
          cp tools/heliohost-tuf-persistence-probe/httpdocs/*.php probe-bundle/httpdocs/
          cp tools/heliohost-tuf-persistence-probe/private/probe-common.php probe-bundle/private/
          cp app/Updates/TufRootStore.php probe-bundle/private/TufRootStore.php
          cp tools/heliohost-tuf-persistence-probe/README.md probe-bundle/README.md
          (
            cd probe-bundle
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            zip -qr ../sentryiq-heliohost-tuf-persistence-probe.zip .
          )
          sha256sum sentryiq-heliohost-tuf-persistence-probe.zip

      - name: Upload HelioHost two-request persistence probe
        if: matrix.php == '8.5'
        uses: actions/upload-artifact@v4
        with:
          name: sentryiq-heliohost-tuf-persistence-probe
          path: sentryiq-heliohost-tuf-persistence-probe.zip
          if-no-files-found: error
          retention-days: 7
