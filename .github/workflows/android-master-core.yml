name: Android Master Adapter

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  android-master-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
      - name: Build shared Rust TUF libraries for Android ABIs
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash native/tuf-core/scripts/build-android-libraries.sh
      - name: Build Android master adapter
        run: gradle --no-daemon --project-dir native/android/SentryIQMaster :master:assembleDebug

      - name: Run Android master core unit tests
        run: gradle --no-daemon --project-dir native/android/SentryIQMaster :master:testDebugUnitTest
      - name: Create Android x86_64 emulator
        run: |
          mkdir -p "$HOME/.android/avd"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf "no\\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name sentryiq-tuf-test --package "system-images;android-35;google_apis;x86_64" --device "pixel_2" --force
          ls -la "$ANDROID_AVD_HOME"
          test -f "$ANDROID_AVD_HOME/sentryiq-tuf-test.ini"
      - name: Boot Android emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd sentryiq-tuf-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/sentryiq-emulator.log 2>&1 &
          for attempt in $(seq 1 120); do
            if adb devices | grep -q "emulator-"; then
              if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                adb shell input keyevent 82 || true
                exit 0
              fi
            fi
            if (( attempt % 12 == 0 )); then
              echo "Waiting for Android emulator boot (attempt $attempt/120)."
              tail -n 60 /tmp/sentryiq-emulator.log || true
              adb devices -l || true
            fi
            sleep 5
          done
          cat /tmp/sentryiq-emulator.log
          adb devices -l || true
          exit 1
      - name: Run Android native TUF FFI instrumentation test
        run: gradle --no-daemon --project-dir native/android/SentryIQMaster :master:connectedDebugAndroidTest
