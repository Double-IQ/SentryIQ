name: iOS Master Core

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ios-master-core:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Build shared Rust TUF XCFramework
        run: bash native/tuf-core/scripts/build-ios-xcframework.sh
      - name: Build iOS master companion core
        run: swift build --package-path native/ios/SentryIQMaster
      - name: Run iOS master companion tests
        run: swift test --package-path native/ios/SentryIQMaster
