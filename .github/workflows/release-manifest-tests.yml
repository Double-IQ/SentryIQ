name: Release Manifest Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-release-manifest.py'
      - 'tests/build_release_manifest.test.py'
      - '.github/workflows/release-manifest-tests.yml'
      - '.github/workflows/release.yml'
      - 'VERSION'
  push:
    branches: [main]
    paths:
      - 'scripts/build-release-manifest.py'
      - 'tests/build_release_manifest.test.py'
      - '.github/workflows/release-manifest-tests.yml'

permissions:
  contents: read

jobs:
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run canonical release manifest tests
        run: python3 tests/build_release_manifest.test.py
