name: Release Manifest Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-release-manifest.py'
      - 'tests/build_release_manifest.test.py'
      - '.github/workflows/release-manifest-tests.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-release-manifest.py'
      - 'tests/build_release_manifest.test.py'
      - '.github/workflows/release-manifest-tests.yml'

permissions:
  contents: read

jobs:
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run canonical release manifest tests
        run: python3 tests/build_release_manifest.test.py
