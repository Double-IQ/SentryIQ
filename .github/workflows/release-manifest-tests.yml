name: Release Manifest Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-release-manifest.py'
      - 'scripts/build-release-package.sh'
      - 'tests/build_release_manifest.test.py'
      - 'tests/release_package.test.py'
      - '.github/workflows/release-manifest-tests.yml'
      - '.github/workflows/release.yml'
      - 'VERSION'
      - 'private_data/**'
  push:
    branches: [main]
    paths:
      - 'scripts/build-release-manifest.py'
      - 'scripts/build-release-package.sh'
      - 'tests/build_release_manifest.test.py'
      - 'tests/release_package.test.py'
      - '.github/workflows/release-manifest-tests.yml'
      - 'VERSION'
      - 'private_data/**'

permissions:
  contents: read

jobs:
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run canonical release manifest tests
        run: python3 tests/build_release_manifest.test.py

      - name: Build the exact release package from this commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          bash scripts/build-release-package.sh \
            "$VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "1345956206" \
            ".github/workflows/release.yml" "$GITHUB_SHA" "release-output"

      - name: Validate package contents, inventory, and checksums
        run: python3 tests/release_package.test.py --dist release-output --version "$(tr -d '\r\n' < VERSION)"
