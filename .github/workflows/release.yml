name: Build SentryIQ Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$TAG" = "$VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Build release package and canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          bash scripts/build-release-package.sh \
            "$VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "1345956206" \
            ".github/workflows/release.yml" "$GITHUB_REF_NAME" "release-output"

      - name: Test canonical release manifest builder
        run: python3 tests/build_release_manifest.test.py

      - name: Validate complete release package
        run: python3 tests/release_package.test.py --dist release-output --version "$(tr -d '\r\n' < VERSION)"

      - name: Attest release package and inventory manifest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-output/sentryiq-*.zip
            release-output/release-manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          ASSETS=(
            "release-output/sentryiq-${VERSION}.zip"
            "release-output/sentryiq-${VERSION}.zip.sha256"
            "release-output/release-manifest.json"
            "release-output/release-manifest.json.sha256"
          )
          gh release create "v${VERSION}" "${ASSETS[@]}" --verify-tag --title "SentryIQ ${VERSION}" --generate-notes
