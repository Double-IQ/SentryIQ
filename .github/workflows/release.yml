name: Build SentryIQ Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$TAG" = "$VERSION"

      - name: Build package and canonical inventory manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          PACKAGE="sentryiq-${VERSION}.zip"
          WORK="release-root"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          git archive --format=tar.gz "$GITHUB_REF_NAME" | tar -xz -C "$WORK"
          rm -rf "$WORK/private_data" "$WORK/.git" "$WORK/.github"
          mkdir -p "$WORK/runtime"
          cp private_data/vault_engine.php "$WORK/runtime/vault_engine.php"
          cp private_data/email_template.php "$WORK/runtime/email_template.php"
          cp private_data/vault_icon_cache.php "$WORK/runtime/vault_icon_cache.php"
          cp private_data/VaultKdfPolicy.php "$WORK/runtime/VaultKdfPolicy.php"

          python3 scripts/build-release-manifest.py \
            --root "$WORK" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "1345956206" \
            --workflow-path ".github/workflows/release.yml" \
            --output "$WORK/update-manifest.json"

          cp "$WORK/update-manifest.json" release-manifest.json
          (
            cd "$WORK"
            zip -qr "../$PACKAGE" .
          )
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          sha256sum release-manifest.json > release-manifest.json.sha256

      - name: Test canonical release manifest builder
        run: python3 tests/build_release_manifest.test.py

      - name: Attest release package and inventory manifest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            sentryiq-*.zip
            release-manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          ASSETS=(
            "sentryiq-${VERSION}.zip"
            "sentryiq-${VERSION}.zip.sha256"
            "release-manifest.json"
            "release-manifest.json.sha256"
          )
          # A release tag/version is single-use. Never replace assets on an
          # existing release: doing so would invalidate previously verified
          # checksums and attestations while retaining the same version tag.
          gh release create "v${VERSION}" "${ASSETS[@]}" --title "SentryIQ ${VERSION}" --generate-notes
