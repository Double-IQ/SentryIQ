name: Native PHP Release Attestation

on:
  pull_request:
    paths:
      - 'docs/native-php-release-attestation.md'
      - 'docs/security/k2gl-tuf-1.2.1-root-rotation.md'
      - '.htaccess'
      - 'tests/origin_security_headers.test.py'
      - 'app/Updates/NativeSigstoreReleaseVerifier.php'
      - 'app/Updates/NativeSigstoreIntegrityAttestationVerifier.php'
      - 'app/Updates/SigstoreProvenance.php'
      - 'app/Updates/ReleaseTrustPolicy.php'
      - 'app/Updates/UpdateManager.php'
      - 'update_apply.php'
      - 'app/Security/FirstRun.php'
      - 'app/Security/FirstRunPaths.php'
      - 'tests/first_run_paths.test.php'
      - 'tests/release_trust_policy.test.php'
      - 'tests/sigstore_provenance.test.php'
      - 'tests/native_sigstore_integrity_adapter.test.php'
      - '.github/workflows/native-release-attestation.yml'
  push:
    branches: [security/native-php-release-attestation, fix/first-run-private-paths-rebased, feat/native-sigstore-node-artifact-verification-rebased]
    paths:
      - 'app/Updates/NativeSigstoreReleaseVerifier.php'
      - 'app/Updates/SigstoreProvenance.php'
      - 'app/Updates/ReleaseTrustPolicy.php'
      - 'app/Updates/UpdateManager.php'
      - 'update_apply.php'
      - 'app/Security/FirstRun.php'
      - 'app/Security/FirstRunPaths.php'
      - 'tests/first_run_paths.test.php'
      - 'tests/release_trust_policy.test.php'
      - 'tests/sigstore_provenance.test.php'
      - '.github/workflows/native-release-attestation.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint native verifier and updater
        run: |
          php -l app/Updates/NativeSigstoreReleaseVerifier.php
          php -l app/Updates/NativeSigstoreIntegrityAttestationVerifier.php
          php -l app/Updates/ReleaseArtifactVerifier.php
          php -l app/Updates/SigstoreProvenance.php
          php -l app/Updates/ReleaseTrustPolicy.php
          php -l app/Updates/TufRootStore.php
          php -l app/Updates/UpdateManager.php
          php -l update_apply.php
          php -l app/Security/FirstRun.php
          php -l app/Security/FirstRunPaths.php
          php -l tests/first_run_paths.test.php
          php -l tests/release_trust_policy.test.php
          php -l tests/sigstore_provenance.test.php
          php -l tests/native_sigstore_integrity_adapter.test.php
      - name: Run release trust policy tests
        run: php tests/release_trust_policy.test.php
      - name: Run SLSA provenance parser tests
        run: php tests/sigstore_provenance.test.php
      - name: Run native integrity adapter tests
        run: php tests/native_sigstore_integrity_adapter.test.php
      - name: Run first-run private path tests
        run: php tests/first_run_paths.test.php
