name: Build HelioHost TUF probe bundle

on:
  pull_request:
    paths:
      - "tools/heliohost-tuf-probe/**"
      - ".github/workflows/heliohost-tuf-probe-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out probe source
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Validate and install pinned dependencies
        working-directory: tools/heliohost-tuf-probe
        run: |
          composer validate
          composer install --no-interaction --no-dev --prefer-dist --classmap-authoritative
          composer check-platform-reqs --no-dev

      - name: Verify and patch the exact TUF dependency
        working-directory: tools/heliohost-tuf-probe
        run: |
          set -euo pipefail
          php -r '
          $installed = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR);
          $packages = $installed["packages"] ?? $installed;
          $tuf = null;
          foreach ($packages as $package) {
              if (($package["name"] ?? null) === "k2gl/tuf") {
                  $tuf = $package;
                  break;
              }
          }
          if (!is_array($tuf)
              || ($tuf["version"] ?? null) !== "1.2.1"
              || ($tuf["source"]["reference"] ?? null) !== "0c324cd765e04c9d47d01fe0e9887d6ab8153bfd") {
              fwrite(STDERR, "Unexpected k2gl/tuf package version or source commit.\n");
              exit(1);
          }
          '
          patch --dry-run -p1 -d vendor/k2gl/tuf < patches/k2gl-tuf-1.2.1-vendor.patch
          patch -p1 -d vendor/k2gl/tuf < patches/k2gl-tuf-1.2.1-vendor.patch
          php -r '
          require "vendor/autoload.php";
          if (!class_exists(\K2gl\Tuf\Exception\NotFoundException::class)
              || !class_exists(\K2gl\Tuf\HttpFetcher::class)) {
              fwrite(STDERR, "Patched TUF classes did not autoload.\n");
              exit(1);
          }
          '
          grep -q 'catch (NotFoundException)' vendor/k2gl/tuf/src/Updater.php
          grep -q 'NotFoundException' vendor/k2gl/tuf/src/HttpFetcher.php

      - name: Assemble private/public upload bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        working-directory: tools/heliohost-tuf-probe
        run: |
          set -euo pipefail
          rm -rf bundle
          mkdir -p bundle/httpdocs bundle/private
          cp probe.php bundle/httpdocs/probe.php
          cp README.md bundle/README.md
          cp -a vendor bundle/private/vendor
          {
            printf 'source_commit=%s\n' "$SOURCE_COMMIT"
            printf 'php_build_version=%s\n' "$(php -r 'echo PHP_VERSION;')"
            printf 'sigstore_verify_version=%s\n' "$(composer show k2gl/sigstore-verify --format=json | php -r '$j=json_decode(stream_get_contents(STDIN), true); echo $j["versions"][0] ?? "unknown";')"
            printf 'tuf_version=%s\n' "$(php -r '$j=json_decode(file_get_contents("vendor/composer/installed.json"), true); foreach (($j["packages"] ?? $j) as $p) { if (($p["name"] ?? "") === "k2gl/tuf") { echo $p["version"]; break; } }')"
            printf 'tuf_source_reference=%s\n' "$(php -r '$j=json_decode(file_get_contents("vendor/composer/installed.json"), true); foreach (($j["packages"] ?? $j) as $p) { if (($p["name"] ?? "") === "k2gl/tuf") { echo $p["source"]["reference"] ?? "unknown"; break; } }')"
            printf 'tuf_patch_sha256=%s\n' "$(sha256sum patches/k2gl-tuf-1.2.1-vendor.patch | cut -d' ' -f1)"
          } > bundle/BUILD-INFO.txt
          (
            cd bundle
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            zip -qr ../sentryiq-heliohost-tuf-probe.zip .
          )
          sha256sum sentryiq-heliohost-tuf-probe.zip

      - name: Upload temporary probe bundle
        uses: actions/upload-artifact@v4
        with:
          name: sentryiq-heliohost-tuf-probe
          path: tools/heliohost-tuf-probe/sentryiq-heliohost-tuf-probe.zip
          if-no-files-found: error
          retention-days: 7
